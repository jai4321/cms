services:
  postgres:
    image: postgres:16-alpine
    container_name: teams_postgres
    restart: unless-stopped
    command: postgres -c timezone=Asia/Kolkata
    environment:
      POSTGRES_USER: teams
      POSTGRES_PASSWORD: teams_secret
      POSTGRES_DB: teams_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U teams -d teams_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: teams_redis
    restart: unless-stopped
    command: redis-server --requirepass redis_secret
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'redis_secret', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
