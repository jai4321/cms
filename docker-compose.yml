services:

  minio:
    image: minio/minio
    container_name: teams_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: teams_minio
      MINIO_ROOT_PASSWORD: gVvn=k5&a$ow6oGi
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
      image: redis:7-alpine
      container_name: teams_redis
      restart: unless-stopped
      command: redis-server --requirepass 0gd|^B|#07zw3eF$
      ports:
        - '6379:6379'
      volumes:
        - redis_data:/data
      healthcheck:
        test: ['CMD', 'redis-cli', '-a', '0gd|^B|#07zw3eF$', 'ping']
        interval: 10s
        timeout: 5s
        retries: 5

volumes:
  minio_data:
  redis_data:
